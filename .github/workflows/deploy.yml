name: Deploy to Vercel and Update Data

on:
  push:
    branches:
      - main
  schedule:
    # Run weekly on Sundays at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch MCP servers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # 仅在定时调度或手动触发时抓取 servers.json
          if [ "${{ github.event_name }}" != "push" ]; then
            python scripts/fetch_mcp_servers.py
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/servers.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update MCP server index [automated]"
              git push
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        if: env.VERCEL_TOKEN != ''
        run: |
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --yes
